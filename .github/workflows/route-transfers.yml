name: Route airport transfers

# Manual only. Driving times change on the timescale of road building, not weather, so
# there is no reason to hammer a free community routing server on a schedule.
on:
  workflow_dispatch:

permissions:
  contents: write            # to publish transfers.json as a release asset

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # ~420 requests at 1.1s apart, plus routing time: six candidate gateways per resort
      # now, not three, because routes over passes that shut for the winter get discarded
      # and there has to be something left to keep. Set explicitly so a hung server fails
      # the job instead of burning an hour.
      - name: Route each resort to six gateways, keep the three open in winter
        timeout-minutes: 45
        run: python3 route_transfers.py

      # Upload before publishing. The first run routed all 70 resorts in 5m45s and then
      # threw the lot away because the release step lacked contents:write - six minutes
      # of a free community server's time wasted on a permissions omission. An artifact
      # survives whatever the publish step does.
      - name: Keep the result regardless of what happens next
        uses: actions/upload-artifact@v4
        with:
          name: transfers
          path: transfers.json

      - name: Publish transfers.json to the 'transfers' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: transfers
          name: Airport transfer times
          files: transfers.json
          fail_on_unmatched_files: true
